name: web cd

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: validate env vars
        env:
          VITE_CAPTCHA_ENABLED: ${{ vars.VITE_CAPTCHA_ENABLED }}
        run: |
          case "$VITE_CAPTCHA_ENABLED" in
            true | false) ;;
            *)
              echo "::error::VITE_CAPTCHA_ENABLED must be 'true' or 'false' (got '$VITE_CAPTCHA_ENABLED')"
              exit 1
              ;;
          esac

      - name: build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CAPTCHA_ENABLED: ${{ vars.VITE_CAPTCHA_ENABLED }}

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: deploy to s3
        env:
          BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: |
          : "${BUCKET:?S3_BUCKET_NAME variable is not set}"
          aws s3 sync dist/ "s3://$BUCKET" \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

      - name: invalidate cloudfront
        env:
          BUCKET: ${{ vars.S3_BUCKET_NAME }}
          REGION: ap-northeast-2
        run: |
          ORIGIN="$BUCKET.s3.$REGION.amazonaws.com"
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Origins.Items[].DomainName, '$ORIGIN')].Id | [0]" \
            --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "::error::No CloudFront distribution found for origin $ORIGIN"
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/"
